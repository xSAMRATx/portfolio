<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%VITE_SITE_NAME% | %VITE_SITE_TITLE%</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="author" content="%VITE_SITE_NAME%" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Social previews (Open Graph + Twitter) -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="%VITE_SITE_NAME%" />
    <meta property="og:title" content="%VITE_SITE_NAME% | %VITE_SITE_TITLE%" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%VITE_SITE_NAME%, %VITE_SITE_TITLE%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SITE_NAME% | %VITE_SITE_TITLE%" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />

    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply the saved (or system) theme before the first paint, so there is no light/dark flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
    <script type="module" src="../js/static-main.tsx"></script>
  </head>
  <body>
    <noscript>
      <h1>%VITE_SITE_NAME%</h1>
      <p>%VITE_SITE_TITLE%. %VITE_SITE_DESCRIPTION%</p>
      <p>Please enable JavaScript to view this site.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
