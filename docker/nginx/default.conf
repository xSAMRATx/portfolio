# nginx config for the "web" service (standard Laravel setup).

server {
    listen 80;
    server_name localhost;

    # Laravel's public/ folder is the only folder the web can see.
    root /var/www/html/public;
    index index.php;

    # Must be >= PHP's upload limit (docker/php/php.ini) for the CV upload.
    client_max_body_size 8M;

    # 1. Real file (e.g. /uploads/cv.pdf)? Serve it.
    # 2. Otherwise hand the request to Laravel's public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files go to PHP-FPM in the "app" container, port 9000.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Never serve hidden files such as .env or .git.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
